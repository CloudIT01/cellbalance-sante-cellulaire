<!doctype html><html lang="fr"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{position:relative;font-family:'Plus Jakarta Sans',sans-serif;background:#052e22}
.photo{position:absolute;inset:0;background:url(hero.jpg) 250px -50px/auto 760px no-repeat}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,#03251b 0%,#03251bf2 38%,#03251b99 58%,#03251b00 72%)}
.content{position:absolute;left:64px;top:56px;bottom:56px;width:640px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:14px;font-family:'Outfit',sans-serif;font-weight:700;font-size:34px;color:#fff}
.logo{width:52px;height:52px;border-radius:12px;background:#059669;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800}
.kicker{margin-top:54px;font-size:20px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#6ee7b7}
h1{margin-top:16px;font-size:56px;line-height:1.1;font-weight:800;color:#fff;letter-spacing:-.01em}
h1 em{font-style:normal;color:#6ee7b7}
.cta{margin-top:auto;display:flex;align-items:center;gap:22px}
.btn{background:#10b981;color:#03251b;font-weight:800;font-size:26px;padding:16px 30px;border-radius:999px}
.meta{color:#d1fae5;font-size:22px;font-weight:500}
</style></head><body>
<div class="photo"></div><div class="shade"></div>
<div class="content">
 <div class="brand"><div class="logo">CB</div>CellBalance</div>
 <div class="kicker">Quiz de connaissances gratuit</div>
 <h1>Vos cellules ont-elles un bon équilibre <em>Oméga-6 / Oméga-3</em>&nbsp;?</h1>
 <div class="cta"><div class="btn">Faire le quiz →</div><div class="meta">10 questions · 2 min</div></div>
</div>
</body></html>
